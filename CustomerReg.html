<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
</head>
<body>
    <h1>Smart Home Service Maintenance System</h1>
    <hr>
    <h2>Customer Registration</h2>

    <p>Create your account to book home services.</p>
    <form>

        <label>
            Full Name:
        </label>
        <br>
        <input type="text" placeholder="Enter your full name" required>
        <br><br>

        <label>
            Email Address:
        </label>
        <br>
        <input type="email" placeholder="Enter your email" required>
        <br><br>
        <label>
            Phone Number:
        </label>
        <br>
        <input type="tel" placeholder="Enter your phone number" required>
        <br><br>

        <label>
            Address:
        </label>
        <br>
        <textarea rows="3" cols="30" placeholder="Enter your address" required></textarea>
        <br><br>

        <label>
            Password:
        </label>
        <br>
        <input type="password" placeholder="Create a password" required>
        <br><br>

        <label>
            Confirm Password:
        </label>
        <br>
        <input type="password" placeholder="Enter password again" required>
        <br><br>

        <input type="checkbox" required>
        <label>
            I agree to the Terms and Conditions
        </label>
        <br><br>

        
        <input type="submit" value="Register">

    </form>
    <hr>
    <p>Already have an account?</p>
    <a href="login.html">Login Here</a>

    <br><br>

    <a href="homepage.html">Back to Home</a>

</body>
</html>
