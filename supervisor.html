<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Registration</title>
    <link rel="stylesheet" href="supervisor.css">

</head>
<body>

<h1>Supervisor Registration</h1>
<h2>Smart Home Service Management System</h2>

<form>

    <fieldset>
        <legend>Account Details</legend>

        <label>Username</label>
        <input type="text" placeholder="Enter username">

        <label>Email</label>
        <input type="email" placeholder="Enter email">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm password">
    </fieldset>

    <fieldset>
        <legend>Personal Details</legend>

        <label>Full Name</label>
        <input type="text" placeholder="Enter full name">

        <label>Gender</label>
        <div class="radio-group">
            <input type="radio" name="gender" value="Male"> <label>Male</label>
            <input type="radio" name="gender" value="Female"> <label>Female</label>
        </div>

        <label>Date of Birth</label>
        <input type="date">

        <label>Phone</label>
        <input type="tel" placeholder="Enter phone number">

        <label>Address</label>
        <input type="text" placeholder="Enter address">
    </fieldset>

    <fieldset>
        <legend>Service Details</legend>

        <label>Service Type</label>
        <select>
            <option>-- Select --</option>
            <option>Plumbing</option>
            <option>Electrical Work</option>
            <option>AC Servicing</option>
            <option>Cleaning</option>
            <option>Carpentry</option>
            <option>Painting</option>
            <option>Pest Control</option>
            <option>Other Maintenance</option>
        </select>

        <label>Experience</label>
        <select>
            <option>0 Year</option>
            <option>1 Year</option>
            <option>2 Years</option>
            <option>3+ Years</option>
        </select>

        <label>Service Area</label>
        <input type="text" placeholder="Enter service area">

        <label>Portfolio / Work Link</label>
        <input type="url" placeholder="https://...">
    </fieldset>

    <fieldset>
        <legend>Documents</legend>

        <label>Upload Profile Photo</label>
        <input type="file" accept="image/*">

        <label>Upload NID / Certificate</label>
        <input type="file">
    </fieldset>

    <fieldset>
        <legend>Confirmation</legend>
        <br>
        <input type="checkbox">
        I confirm that the information is accurate and I agree to the terms and conditions.
    </fieldset>

    <button type="submit">Register</button>

</form>

</body>
</html>
