<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../../myDesign_admin/style.css">
  <title>Admin Registration</title>
</head>
<body>


    <table border="1" align="center">
        <tr>
            <td width="40%" align="center">
                <h1>Smart Home </h1>
                <h2>Maintenance System</h2><br><br>
                <p>Register as an admin to manage users,services and system.</p>
            </td>
            <td width="60%">
       
 
  <h3>Admin Registration</h3>
  <p>Fill in the details below to create your admin account.</p>
 
  <form>
    <label>Full Name <span>*</span></label><br>
    <input type="text" size="45" placeholder="Enter your full name" > <br><br>
 
    <label>Email Address <span>*</span></label><br>
    <input type="email" size="45" placeholder="Enter your email address" > <br><br>
 
    <label>Phone Number <span>*</span> </label><br>
    <input type="number" size="42" placeholder="Enter your phone number" > <br><br>
 
    <label>Username <span>*</span></label><br>
    <input type="text" size="45" placeholder="Create a username" > <br><br>
 
    <label>Password <span>*</span></label><br>
    <input type="password" size="45"  placeholder="Create a password" > <br><br>
 
    <label>Confirm Password <span>*</span> </label><br>
    <input type="password" size="45" placeholder="Confirm your password" > <br><br>
 
    <label>Admin Security Code <span>*</span></label><br>
    <input type="text" size="45" placeholder="Enter admin security code"> <br><br>
 
    <input type="submit" value="Create Admin Account">
  </form>
 
  <p>Already have an account? <a href="../login/login.html">Login</a></p>
   <a href="../home/home.html">Home</a>   <br><br>
            </td>
        </tr>
  </table>
</body>
</html>
