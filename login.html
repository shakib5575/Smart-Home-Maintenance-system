<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
 
    <link rel="stylesheet" href="CSS_Service/login.css">
</head>
<body>
    <div class="container">
 
        <div class="left">
            <h1>Smart Home Maintenance System</h1>
            <p>Welcome back! We are so happy to have you here.
            It's great to see you again. We hope you had a safe
            and enjoyable time away.</p>
        </div>
 
        <div class="right">
            <form id="loginForm" novalidate>
                <h2>Login Here</h2>
 
                <label for="email">Email Address:</label>
                <br>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email">
                <p id="emailError"></p>
 
                <label for="password">Password:</label>
                <br>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password">
                <p id="passwordError"></p>
 
                <div class="remember">
                    <input type="checkbox" id="Remember" name="Remember">
                    <label for="Remember">Remember me</label>
                </div>
                <br>
 
                <input type="submit" value="Login" class="button"
                       onclick="return loginValidation()">
                <br><br>
 
                <div class="links">
                    <a href="">Don't have an account?</a>
                    <a href="">Forgot password?</a>
                </div>
            </form>
        </div>
    </div>
 
    <script src="./JS_Service/login.js"></script>
</body>
</html>
