<!DOCTYPE html>
<html>
<head>
  <title>Admin Registration</title>
</head>
<body>

    <table border="1" align="center">
        <tr>
            <td width="40%" align="center">
                <h1>Smart Home </h1>
                <h2>Maintenance System</h2><br><br>
                <p>Register as an admin to manage users,services and system.</p>
            </td>
            <td width="60%">
       
 
  <h3>Admin Registration</h3>
  <p>Fill in the details below to create your admin account.</p>
 
  <form>
    <label>Full Name *</label><br>
    <input type="text" size="45" placeholder="Enter your full name" required> <br><br>
 
    <label>Email Address *</label><br>
    <input type="email" size="45" placeholder="Enter your email address" required> <br><br>
 
    <label>Phone Number *</label><br>
    <input type="number" size="42" placeholder="Enter your phone number" required> <br><br>
 
    <label>Username *</label><br>
    <input type="text" size="45" placeholder="Create a username" required> <br><br>
 
    <label>Password *</label><br>
    <input type="password" size="45"  placeholder="Create a password" required> <br><br>
 
    <label>Confirm Password *</label><br>
    <input type="password" size="45" placeholder="Confirm your password" required> <br><br>
 
    <label>Admin Security Code *</label><br>
    <input type="text" size="45" placeholder="Enter admin security code"> <br><br>
 
    <input type="submit" value="Create Admin Account">
  </form>
 
  <p>Already have an account? <a href="../login/login.html">Login</a></p>
   <a href="../home/home.html">Home</a>   <br><br>
            </td>
        </tr>
  </table>
</body>
</html>
